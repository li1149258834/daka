name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          { npm install; npx cordova platform add android; npx cordova build android --debug; } 2>&1 | tee build.log
      - name: Save error log
        if: steps.build.outcome == 'failure'
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          tail -150 build.log > BUILD_ERROR.txt 2>/dev/null || echo "no log" > BUILD_ERROR.txt
          git add -f BUILD_ERROR.txt
          git commit -m "ci: build error [skip ci]" || true
          git push || true
      - name: Publish APK to Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Noir Whiskers APK ${{ github.run_number }}
          files: platforms/android/app/build/outputs/apk/debug/app-debug.apk
