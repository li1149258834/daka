<!DOCTYPE html>
<html lang="zh-CN" style="--accent: #ff8fb1; --accent2: #ffb199;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">

<title>双人打卡 · 互相监督</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f7fd;--card:#fff;--ink:#1e2438;--sub:#8a92a8;--line:#edf1f9;
  --accent:#5b8cff;--accent2:#7b6cff;
  --ok:#28b485;--warn:#ff9f43;--bad:#f06a72;
  --r:20px;--sh:0 4px 18px rgba(46,66,120,.07);
}
html,body{margin:0;padding:0;min-height:100%;
  background:
    radial-gradient(900px 420px at 100% -8%, #e7eeff 0%, rgba(231,238,255,0) 62%),
    radial-gradient(720px 400px at -12% 2%, #fdeaf2 0%, rgba(253,234,242,0) 58%),
    var(--bg);
  background-attachment:fixed;color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 14px 100px}
header{position:sticky;top:0;z-index:20;padding:16px 2px 10px;
  background:linear-gradient(to bottom,rgba(244,247,253,.97) 68%,rgba(244,247,253,0));
  backdrop-filter:blur(10px)}
.htop{display:flex;align-items:baseline;gap:10px}
.htop h1{margin:0;font-size:19px;font-weight:750;letter-spacing:.4px}
.hdate{font-size:12px;color:var(--sub)}
.hsub{font-size:11px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:6px}
.seg{display:flex;gap:10px;margin-top:13px}
.segbtn{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;
  border-radius:16px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;
  box-shadow:0 1px 5px rgba(46,66,120,.05);transition:.18s}
.segbtn .av{font-size:19px;line-height:1}
.segbtn .nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segbtn .st{margin-left:auto;font-size:11px;color:var(--sub);white-space:nowrap}
.segbtn.on{color:#fff;border-color:transparent}
.segbtn.on.her{background:linear-gradient(135deg,#ff8fb1,#ffb199);box-shadow:0 8px 20px rgba(255,143,177,.32)}
.segbtn.on.me{background:linear-gradient(135deg,#5b8cff,#7b6cff);box-shadow:0 8px 20px rgba(91,140,255,.30)}
.segbtn.on .st{color:rgba(255,255,255,.92)}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.mini{padding:13px 16px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 .tag{margin-left:auto;font-size:11px;font-weight:400;color:var(--sub)}
.mut{color:var(--sub);font-size:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.hero{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.heroL{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.av.big{font-size:25px;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(70,100,220,.20)}
.heroName{font-weight:750;font-size:17px}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;position:relative;
  background:conic-gradient(var(--accent) calc(var(--p) * 1%), #eef2fa 0)}
.ring::after{content:'';position:absolute;inset:7px;border-radius:50%;background:#fff}
.ring span{position:relative;font-size:12px;font-weight:750;color:var(--accent)}

.task{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;background:#f8fafe;
  margin-bottom:8px;transition:.15s;cursor:pointer}
.task:last-child{margin-bottom:0}
.task input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;margin:0}
.task .tk{flex:1;font-size:14px}
.task.done{background:#f1fbf6}
.task.done .tk{color:var(--sub);text-decoration:line-through}

.btn{border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:650;color:#fff;width:100%;
  cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 18px rgba(70,100,220,.18);transition:.18s}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;box-shadow:none;border-radius:11px}
.btn.gray{background:#eef1f8;color:#5a6480;box-shadow:none}
.btn.green{background:linear-gradient(135deg,#34c48a,#22b573);box-shadow:0 8px 18px rgba(34,181,115,.20)}
.btn.red{background:#fdecec;color:#c63b43;box-shadow:none}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:10px 12px;
  font:inherit;background:#fbfcff;color:var(--ink);outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff;
  box-shadow:0 0 0 3px rgba(91,140,255,.10)}
textarea{min-height:66px;resize:vertical}
label.fl{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}

.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:#eef1f8;color:#5a6480}
.pill.ok{background:#e6f8f0;color:#12855a}
.pill.no{background:#fdecec;color:#c63b43}
.bar{height:8px;border-radius:8px;background:#eef2fa;overflow:hidden;margin:9px 0 6px}
.bar i{display:block;height:100%;border-radius:8px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}

.bcard{background:#fff;border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--sh);
  border-left:4px solid var(--accent)}
.bcard.her{border-left-color:#ff8fb1}
.bcard.me{border-left-color:#5b8cff}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:15px}
.bhead .av{font-size:20px}
.bhead b{font-weight:700}
.bhead .pill{margin-left:auto}

.list-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0;padding-bottom:0}
.list-item .g{flex:1;min-width:0}
.list-item .q{font-weight:600;word-break:break-word}
.list-item .a{color:#3d4460;font-size:13px;margin-top:3px;word-break:break-word}

.word{text-align:center;padding:18px 8px 6px}
.word .en{font-size:32px;font-weight:750;word-break:break-word;letter-spacing:.3px}
.word .ipa{color:var(--sub);margin-top:3px}
.reveal{font-size:18px;font-weight:650;text-align:center;margin-top:14px}

.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.grid3 .n{font-size:20px;font-weight:750;color:var(--accent)}
.grid3 .l{font-size:11px;color:var(--sub);margin-top:1px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--sub);
  padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  border-radius:12px;transition:.15s}
.tabs button .ic{font-size:18px;line-height:1}
.tabs button.on{color:var(--accent);font-weight:750;background:rgba(91,140,255,.07)}
.tabs button.on.her{color:#ff7ba6;background:rgba(255,143,177,.10)}

.empty{text-align:center;color:var(--sub);font-size:13px;padding:20px 10px;line-height:1.8}
.nudge{background:linear-gradient(135deg,#fff9ef,#fff4e4);border:1px solid #ffe6c2;border-radius:14px;
  padding:10px 12px;font-size:13px;margin-bottom:8px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-8px);background:#222a44;color:#fff;
  padding:10px 18px;border-radius:22px;font-size:13px;z-index:99;opacity:0;transition:.25s;
  pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(20,30,60,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dot{width:7px;height:7px;border-radius:50%;background:#b9c0d2;display:inline-block}
.dot.ok{background:#3ecf8e}.dot.err{background:#f06a72}.dot.wait{background:#ffc46b}

.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead b{font-size:16px}
.calhead .sp{margin-left:auto;display:flex;gap:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calwd{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.calday{position:relative;aspect-ratio:1/1;border-radius:12px;background:#f8fafe;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:.15s}
.calday.empty{background:transparent;cursor:default}
.calday.today{outline:2px solid var(--accent);outline-offset:-2px}
.calday.sel{background:#eef2ff}
.calday .dn{font-weight:600;line-height:1}
.calday .dots{display:flex;gap:3px;height:7px;margin-top:3px}
.dotm{width:6px;height:6px;border-radius:50%;display:inline-block}
.dotm.her{background:#ff8fb1}
.dotm.me{background:#5b8cff}
.calleg{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:11px;align-items:center}
.statline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.statline:last-child{border-bottom:0}
</style>
</head>

/* ---- 合并（用于云同步 / 同步码） ---- */
function mergeState(a, b){
  if (!a) return clone(b);
  if (!b) return clone(a);
  const out = clone(a);
  // 每日记录：同一天同一人取 at 更新的
  for (const d of Object.keys(b.daily||{})){
    out.daily[d] = out.daily[d] || {};
    for (const u of Object.keys(b.daily[d]||{})){
      const x = out.daily[d][u], y = b.daily[d][u];
      if (!x || (y.at||'') > (x.at||'')) out.daily[d][u] = y;
    }
  }
  // 单词
  const wa = out.words, wb = b.words||{};
  wa.cursor = Math.max(wa.cursor||0, wb.cursor||0);
  if ((wb.metaAt||'') > (wa.metaAt||'')) { wa.perDay = wb.perDay; wa.endDate = wb.endDate; wa.metaAt = wb.metaAt; }
  for (const d of Object.keys(wb.days||{})){
    const x = wa.days[d], y = wb.days[d];
    if (!x) { wa.days[d] = y; continue; }
    const known = Array.from(new Set([...(x.known||[]), ...(y.known||[])])).sort((p,q)=>p-q);
    const unknown = Array.from(new Set([...(x.unknown||[]), ...(y.unknown||[])])).sort((p,q)=>p-q);
    wa.days[d] = { from:Math.min(x.from,y.from), to:Math.max(x.to,y.to), known, unknown, done: !!(x.done||y.done) };
  }
  // 列表类：按 id 去重
  const byId = (x, y) => {
    const m = new Map();
    for (const it of (x||[])) m.set(it.id, it);
    for (const it of (y||[])) {
      const old = m.get(it.id);
      if (!old) m.set(it.id, it);
      else m.set(it.id, ((it.at||'') > (old.at||'')) ? it : old);
    }
    return Array.from(m.values());
  };
  out.errors = byId(out.errors, b.errors);
  out.practice = byId(out.practice, b.practice);
  out.logs = byId(out.logs, b.logs);
  out.reviewLog = byId(out.reviewLog, b.reviewLog);
  out.nudges = byId(out.nudges, b.nudges);
  const k = out.knowledge;
  for (const key of Object.keys(b.knowledge||{})){
    if (!k[key]) k[key] = b.knowledge[key];
    else k[key].items = byId(k[key].items, b.knowledge[key].items);
  }
  out.updatedAt = (a.updatedAt||'') > (b.updatedAt||'') ? a.updatedAt : b.updatedAt;
  return out;
}

/* ---- 同步码 ---- */
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s){ return decodeURIComponent(escape(atob(s))); }
function makeCode(){ return 'DAKA1:' + b64enc(JSON.stringify(S)); }
function applyCode(code){
  code = (code||'').trim().replace(/\s+/g,'');
  if (code.startsWith('DAKA1:')) code = code.slice(6);
  let rs; try { rs = JSON.parse(b64dec(code)); } catch(e){ throw new Error('同步码格式不对'); }
  S = mergeState(S, rs); save(); render();
}

/* ---- 云同步（Gitee / GitHub Gist） ---- */
const CK = 'daka.cloud';
let cloud = JSON.parse(localStorage.getItem(CK) || 'null') || { provider:'gitee', token:'', gistId:'', auto:false };
let cloudState = 'off';   // off | syncing | ok | err
function saveCloud(){ localStorage.setItem(CK, JSON.stringify(cloud)); }

function ghHeaders(){
  return cloud.provider === 'github'
    ? { 'Authorization':'token '+cloud.token, 'Content-Type':'application/json', 'Accept':'application/vnd.github+json' }
    : { 'Content-Type':'application/json' };
}
function apiBase(){
  return cloud.provider === 'github' ? 'https://api.github.com/gists' : 'https://gitee.com/api/v5/gists';
}
function withToken(url){
  if (cloud.provider === 'gitee') return url + (url.includes('?')?'&':'?') + 'access_token=' + encodeURIComponent(cloud.token);
  return url;
}

async function cloudCreate(){
  const body = { description:'双人打卡数据（勿删）', public:false,
    files:{ 'daka.json': { content: JSON.stringify(S) } } };
  if (cloud.provider === 'gitee') body.access_token = cloud.token;
  const r = await fetch(apiBase(), { method:'POST', headers: ghHeaders(), body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || ('HTTP '+r.status));
  cloud.gistId = j.id; saveCloud();
  return j.id;
}
async function cloudPull(){
  if (!cloud.gistId) return null;
  const r = await fetch(withToken(apiBase()+'/'+cloud.gistId), { headers: ghHeaders() });
  if (!r.ok) return null;
  const j = await r.json();
  const f = j.files && j.files['daka.json'];
  if (!f) return null;
  const content = f.content || (f.raw_url ? await fetch(f.raw_url).then(x=>x.text()) : '');
  if (!content) return null;
  try { return JSON.parse(content); } catch(e){ return null; }
}
async function cloudPush(){
  if (!cloud.gistId) { await cloudCreate(); return; }
  const body = { files:{ 'daka.json': { content: JSON.stringify(S) } } };
  if (cloud.provider === 'gitee') body.access_token = cloud.token;
  const r = await fetch(apiBase()+'/'+cloud.gistId, { method:'PATCH', headers: ghHeaders(), body: JSON.stringify(body) });
  if (!r.ok) { const j = await r.json().catch(()=>({})); throw new Error(j.message || ('HTTP '+r.status)); }
}
async function cloudSync(manual){
  if (!cloud.token) { if (manual) toast('请先填写 Token'); return; }
  cloudState = 'syncing'; drawSync();
  try {
    if (!cloud.gistId) await cloudCreate();
    const rs = await cloudPull();
    if (rs) { S = mergeState(S, rs); save(); }
    await cloudPush();
    cloudState = 'ok';
    if (manual) toast('同步成功');
  } catch(e){
    cloudState = 'err';
    if (manual) toast('同步失败：' + e.message);
  }
  render();
}

function usr(date,u){
  S.daily[date] = S.daily[date] || {};
  const d = S.daily[date];
  if (!d[u]) d[u] = { checkin:false, note:'', tasks:{}, at:NOW() };
  if (!d[u].tasks) d[u].tasks = {};
  return d[u];
}
function streak(u){
  let n=0, d=TODAYS;
  for (let i=0;i<400;i++){ const r=S.daily[d] && S.daily[d][u]; if (r&&r.checkin){n++;d=addDays(d,-1);} else break; }
  return n;
}
function rate30(u){
  let done=0;
  for (let i=0;i<30;i++){ const d=addDays(TODAYS,-i), r=S.daily[d]&&S.daily[d][u]; if(r&&r.checkin) done++; }
  return Math.round(done/30*100);
}

function plan(){
  const w = S.words; w.days = w.days||{}; w.cursor = w.cursor||0; w.perDay = w.perDay||27;
  w.endDate = w.endDate || '2026-12-31';
  const daysLeft = Math.max(1, Math.round((new Date(w.endDate+'T00:00:00') - new Date(TODAYS+'T00:00:00'))/86400000));
  const remain = Math.max(0, VOCAB.total - w.cursor);
  return { w, total: VOCAB.total, daysLeft, remain, suggest: Math.max(1, Math.ceil(remain/daysLeft)) };
}
function startToday(){
  const { w, total, suggest } = plan();
  if (w.days[TODAYS]) return;
  const per = Math.max(1, Math.min(300, Number(w.perDay)||suggest));
  const from = w.cursor, to = Math.min(total, from+per);
  w.days[TODAYS] = { from, to, known:[], unknown:[], done:false };
  w.cursor = to; save(); render();
}
function grade(idx, known){
  const rec = S.words.days[TODAYS]; if (!rec) return;
  const knownArr = (rec.known||[]).slice(), unkArr = (rec.unknown||[]).slice();
  const already = knownArr.includes(idx) || unkArr.includes(idx);
  if (known) { if(!knownArr.includes(idx)) knownArr.push(idx); }
  else {
    if(!unkArr.includes(idx)) unkArr.push(idx);
    if (!already) { const wd = VOCAB.words[idx];
      S.errors.push({ id:uid(), user:'her', subject:'英语单词', src:wd.u, at:NOW(),
        q: wd.en + (wd.ipa? '  '+wd.ipa:''), a:(wd.pos?wd.pos+' ':'')+wd.cn,
        note:'', stage:0, mastered:false, nextReview:addDays(TODAYS,1), createdAt:TODAYS });
    }
  }
  rec.known = knownArr; rec.unknown = unkArr;
  save(); render(); schedulePush();
}

function weekSummary(){
  const [a,b] = weekRange(calSel);
  const days = []; for (let d=a; d<=b; d=addDays(d,1)) days.push(d);
  const ck = u => days.filter(d=>S.daily[d]&&S.daily[d][u]&&S.daily[d][u].checkin).length;
  const herWords = days.reduce((s,d)=>{ const r=S.words.days[d]; return s + (r? Math.max(0, r.to-r.from):0); },0);
  const herErr = (S.reviewLog||[]).filter(r=>r.user==='her' && r.date>=a && r.date<=b).length;
  const herPr = S.practice.filter(p=>p.user==='her' && p.date>=a && p.date<=b).length;
  const ml = (S.logs||[]).filter(l=>l.user==='me' && l.date>=a && l.date<=b);
  const cnt = k => ml.filter(l=>l.track===k).length;
  const sportDays = new Set(ml.filter(l=>l.track==='sport').map(l=>l.date)).size;
  const line = (l,r)=>`<div class="statline"><span>${l}</span><b>${r}</b></div>`;
  return `<div class="card"><h2>🗓 一周小结 <span class="tag">${MM(a)} ~ ${MM(b)}</span></h2>
    <div class="mut" style="margin-bottom:6px">🌸 ${esc(S.users.her.name)}</div>
    ${line('打卡天数', ck('her')+' / 7 天')}
    ${line('背单词', herWords+' 词')}

    ${line('📱 自媒体（视频/文案）', cnt('media')+' 条')}
    ${line('🎬 AI视频制作', cnt('ai')+' 条')}
    ${line('🏃 锻炼', sportDays+' 天 / '+cnt('sport')+' 次')}

function viewCalendar(){
  const [y,m] = calYM.split('-').map(Number);
  const offset = (new Date(y, m-1, 1).getDay()+6)%7;
  const dim = new Date(y, m, 0).getDate();
  let cells = [];
  for (let i=0;i<offset;i++) cells.push(null);
  for (let d=1; d<=dim; d++){
    const ds = calYM+'-'+pad(d);
    const her = !!(S.daily[ds]&&S.daily[ds].her&&S.daily[ds].her.checkin);
    const him = !!(S.daily[ds]&&S.daily[ds].me&&S.daily[ds].me.checkin);
    cells.push({d, ds, her, him});
  }
  const grid = cells.map(c=> c
    ? `<div class="calday ${c.ds===TODAYS?'today':''} ${c.ds===calSel?'sel':''}" onclick="calPick('${c.ds}')">
         <span class="dn">${c.d}</span>
         <span class="dots">${c.her?'<i class="dotm her"></i>':''}${c.him?'<i class="dotm me"></i>':''}</span>
       </div>`
    : '<div class="calday empty"></div>').join('');
  const wd = ['一','二','三','四','五','六','日'].map(x=>`<div class="calwd">${x}</div>`).join('');
  const monthCk = Object.keys(S.daily).filter(d=>d.slice(0,7)===calYM);
  const herM = monthCk.filter(d=>S.daily[d].her&&S.daily[d].her.checkin).length;
  const himM = monthCk.filter(d=>S.daily[d].me&&S.daily[d].me.checkin).length;
  return `
  <div class="card"><div class="calhead">
      <b>${y} 年 ${m} 月</b>
      <div class="sp">
        <button class="btn sm gray" onclick="calMove(-1)">‹</button>
        <button class="btn sm gray" onclick="calPick('${TODAYS}');calYM='${TODAYS.slice(0,7)}';render()">今天</button>
        <button class="btn sm gray" onclick="calMove(1)">›</button></div></div>
    <div class="calgrid">${wd}${grid}</div>
    <div class="calleg"><span><i class="dotm her"></i> ${esc(S.users.her.name)}</span>
      <span><i class="dotm me"></i> ${esc(S.users.me.name)}</span>
      <span style="margin-left:auto">本月 ${herM} / ${himM} 天</span></div>
  </div>
  ${dayDetail(calSel)}
  ${weekSummary()}`;
}

async function ghApi(path, method, body){
  const r = await fetch('https://api.github.com'+path, {
    method: method||'GET',
    headers:{ 'Authorization':'token '+pub.token, 'Content-Type':'application/json',
              'Accept':'application/vnd.github+json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const txt = await r.text();
  let j = {};
  try { j = txt ? JSON.parse(txt) : {}; } catch(e){ j = { message: txt.slice(0,150) }; }
  return { ok:r.ok, status:r.status, data:j };
}
function makeIcon(size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,size,size);
  grad.addColorStop(0,'#4f6ef7'); grad.addColorStop(1,'#8b5cf6');
  g.fillStyle = grad; g.fillRect(0,0,size,size);
  g.strokeStyle = '#fff'; g.lineWidth = size*0.075; g.lineCap='round'; g.lineJoin='round';
  g.beginPath();
  g.moveTo(size*0.26,size*0.53); g.lineTo(size*0.43,size*0.70); g.lineTo(size*0.76,size*0.31);
  g.stroke();
  return c.toDataURL('image/png').split(',')[1];
}

function swSource(){
  return "const C='daka-v3';" +
  "self.addEventListener('install',function(e){self.skipWaiting()});" +
  "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});" +
  "self.addEventListener('fetch',function(e){if(e.request.method!=='GET')return;" +
  "var nav=(e.request.mode==='navigate');" +
  "e.respondWith(caches.open(C).then(function(c){" +
  "if(nav){return fetch(e.request).then(function(res){if(res&&res.status===200)c.put(e.request,res.clone());return res;})" +
  ".catch(function(){return c.match(e.request);});}" +
  "return c.match(e.request).then(function(r){" +
  "var f=fetch(e.request).then(function(res){if(res&&res.status===200)c.put(e.request,res.clone());return res;}).catch(function(){return r;});" +
  "return r||f;});}));}";
}

async function publishApp(){
  const msg = $('#pubMsg');
  const log = t => { msg.innerHTML = t; };
  if (!pub.token) { toast('请先填写 GitHub Token'); return; }
  const repo = pub.repo || 'daka';
  try {
    log('① 读取账号…');
    const me = await ghApi('/user');
    if (!me.ok) throw new Error(me.data.message || ('HTTP '+me.status));
    const owner = me.data.login;
    log('② 创建仓库 ' + owner + '/' + repo + ' …');
    await ghApi('/user/repos','POST',{ name:repo, private:false, auto_init:true, description:'双人打卡监督 App' });
    log('③ 上传文件…');
    const html = publishedHtml();
    const textFiles = {
      'index.html': html,
      'www/index.html': html,
      'config.xml': configXml(),
      'package.json': pkgJson(),
      '.github/workflows/build-apk.yml': workflowYml(),
      'manifest.json': manifestSource(),
      'sw.js': swSource()
    };
    const files = {};
    for (const k of Object.keys(textFiles)) files[k] = b64enc(textFiles[k]);
    files['icon-192.png'] = makeIcon(192);
    files['icon-512.png'] = makeIcon(512);
    for (const name of Object.keys(files)){
      let sha = null;
      const cur = await ghApi('/repos/'+owner+'/'+repo+'/contents/'+name);
      if (cur.ok && cur.data && cur.data.sha) sha = cur.data.sha;
      const body = { message:'更新 '+name, content: files[name] };
      if (sha) body.sha = sha;
      const r = await ghApi('/repos/'+owner+'/'+repo+'/contents/'+name, 'PUT', body);
      if (!r.ok) throw new Error(name + '：' + (r.data.message || r.status));
    }
    log('④ 开启 Pages…');
    const p = await ghApi('/repos/'+owner+'/'+repo+'/pages');
    if (!p.ok) await ghApi('/repos/'+owner+'/'+repo+'/pages','POST',{ source:{ branch:'main', path:'/' } });
    else await ghApi('/repos/'+owner+'/'+repo+'/pages','PUT',{ source:{ branch:'main', path:'/' } });
    pub.url = 'https://' + owner + '.github.io/' + repo + '/';
    pub.apk = 'https://github.com/' + owner + '/' + repo + '/releases/latest/download/app-debug.apk';
    pub.actions = 'https://github.com/' + owner + '/' + repo + '/actions';
    savePub(); toast('发布成功'); render();
  } catch(e){
    log('❌ 发布失败：' + esc(e.message));
    toast('发布失败：' + e.message);
  }
}

  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = '双人打卡-'+TODAYS+'.json'; a.click();
}
function importFile(){ $('#fileIn').click(); }
function doImport(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { S = mergeState(S, JSON.parse(r.result)); save(); render(); toast('导入成功'); } catch(e){ toast('文件格式不对'); } };
  r.readAsText(f);
}
function doReset(){
  if (!confirm('确定清空本机所有打卡数据吗？云端数据不受影响（下次同步会拉回来）。')) return;
  S = defaultState(); save(); render();
}

/* ================= 自动同步 ================= */
let pushTimer = null;
function schedulePush(){
  if (!cloud.auto || !cloud.token) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>cloudSync(false), 2500);
}
setInterval(()=>{ if (cloud.auto && cloud.token && document.visibilityState==='visible') cloudSync(false); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && cloud.auto && cloud.token) cloudSync(false); });

/* ================= 启动 ================= */
S = load(); S.logs = S.logs || []; S.reviewLog = S.reviewLog || [];
render();
if (cloud.auto && cloud.token) cloudSync(false);
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
